<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Quiz Coach"/>
<title>Training Quiz Coach</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f8ef7">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0c10;--bg2:#0f1218;--bg3:#161b24;--bg4:#1e2633;
  --bd:#232d3f;--bd2:#2d3a50;--tx:#e8edf5;--tx2:#8a9ab5;--tx3:#5a6a82;
  --ac:#4f8ef7;--ac2:#6ba3ff;--gr:#34d48a;--rd:#f75858;--am:#f7a934;--pu:#a78bfa;
}
[data-theme=light]{
  --bg:#f0f4fa;--bg2:#fff;--bg3:#e8edf7;--bg4:#d8e0ee;
  --bd:#c8d4e8;--bd2:#b0c0d8;--tx:#0f1928;--tx2:#4a5870;--tx3:#8090a8;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;font-size:14px;line-height:1.5}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}
.app{display:flex;height:100vh;overflow:hidden}
.sb{width:210px;min-width:210px;background:var(--bg2);border-right:1px solid var(--bd);display:flex;flex-direction:column;transition:transform .3s;z-index:100}
.sb-logo{padding:18px 16px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700}
.sb-icon{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--ac),var(--pu));display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.sb-nav{flex:1;padding:10px 8px;overflow-y:auto}
.nav-lbl{font-size:10px;font-weight:700;color:var(--tx3);letter-spacing:1px;text-transform:uppercase;padding:8px 8px 4px}
.ni{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;color:var(--tx2);transition:all .15s;margin-bottom:1px;border:1px solid transparent;user-select:none}
.ni:hover{background:var(--bg3);color:var(--tx)}
.ni.active{background:rgba(79,142,247,.12);color:var(--ac2);border-color:rgba(79,142,247,.2)}
.sb-foot{padding:10px 12px;border-top:1px solid var(--bd);font-size:10px;color:var(--tx3)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:54px;background:var(--bg2);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 16px;gap:10px;flex-shrink:0}
.tb-title{font-size:15px;font-weight:600;flex:1}
.content{flex:1;overflow-y:auto;padding:20px}
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:18px;margin-bottom:14px}
.ct{font-size:11px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .15s;font-family:inherit;white-space:nowrap}
.btn-p{background:var(--ac);color:#fff}.btn-p:hover{background:var(--ac2)}
.btn-s{background:var(--bg3);color:var(--tx);border:1px solid var(--bd2)}.btn-s:hover{background:var(--bg4)}
.btn-g{background:transparent;color:var(--tx2);border:none}.btn-g:hover{background:var(--bg3);color:var(--tx)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-lg{padding:12px 22px;font-size:15px;width:100%;justify-content:center}
.btn:disabled{opacity:.4;cursor:not-allowed}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.b-easy{background:rgba(52,212,138,.15);color:var(--gr)}
.b-medium{background:rgba(247,169,52,.15);color:var(--am)}
.b-hard{background:rgba(247,88,88,.15);color:var(--rd)}
.b-topic{background:rgba(79,142,247,.12);color:var(--ac2)}
.b-pass{background:rgba(52,212,138,.15);color:var(--gr)}
.b-fail{background:rgba(247,88,88,.15);color:var(--rd)}
.inp,.ta,.sel{background:var(--bg3);border:1px solid var(--bd2);border-radius:8px;color:var(--tx);font-family:inherit;font-size:13px;width:100%;padding:9px 12px;transition:border-color .15s}
.ta{resize:vertical;min-height:80px}
.sel{cursor:pointer}
.inp:focus,.ta:focus,.sel:focus{outline:none;border-color:var(--ac)}
.inp::placeholder,.ta::placeholder{color:var(--tx3)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kv{font-size:26px;font-weight:700;letter-spacing:-1px;line-height:1}
.kl{font-size:11px;color:var(--tx2);margin-top:3px}
.pb{background:var(--bg3);border-radius:99px;overflow:hidden;height:6px}
.pf{height:100%;border-radius:99px;transition:width .5s}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--bd);margin-bottom:16px}
.tab{padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--tx2);background:transparent;border-top:none;border-left:none;border-right:none;font-family:inherit;transition:all .15s}
.tab:hover{color:var(--tx)}.tab.active{color:var(--ac2);border-bottom-color:var(--ac)}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;flex-wrap:wrap}
.st{font-size:18px;font-weight:700;letter-spacing:-.3px}
.ss{font-size:13px;color:var(--tx2);margin-top:2px}
.err-box{color:var(--rd);font-size:12px;margin-top:8px;padding:10px 12px;background:rgba(247,88,88,.08);border-radius:8px;font-family:monospace;white-space:pre-wrap;word-break:break-all;max-height:150px;overflow-y:auto}
.dz{border:2px dashed var(--bd2);border-radius:12px;padding:32px 18px;text-align:center;cursor:pointer;background:var(--bg3);transition:all .15s}
.dz:hover,.dz.over{border-color:var(--ac);background:rgba(79,142,247,.05)}
.mc{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:16px 18px;transition:all .15s;margin-bottom:8px}
.mc:hover{border-color:var(--ac)}
.tog{display:inline-flex;gap:3px;background:var(--bg3);padding:3px;border-radius:8px}
.tog-b{padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all .15s;background:transparent;color:var(--tx2)}
.tog-b.active{background:var(--bg2);color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.rc{padding:7px 14px;border-radius:8px;border:2px solid var(--bd2);cursor:pointer;font-size:12.5px;font-weight:600;transition:all .15s;background:var(--bg3);color:var(--tx2);user-select:none}
.rc:hover{border-color:var(--ac);color:var(--tx)}.rc.active{border-color:var(--ac);background:rgba(79,142,247,.1);color:var(--ac2)}
.mb-btn{display:none;align-items:center;justify-content:center;width:36px;height:36px;border-radius:8px;border:1px solid var(--bd);background:transparent;color:var(--tx);cursor:pointer;font-size:18px;flex-shrink:0}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--bd2);border-top-color:var(--ac);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:5px}
@keyframes spin{to{transform:rotate(360deg)}}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99}
@media(max-width:768px){
  .sb{position:fixed;top:0;bottom:0;left:0;transform:translateX(-100%)}
  .sb.open{transform:translateX(0)}
  .mb-btn{display:flex}
  .g2,.g3{grid-template-columns:1fr}
  .g4{grid-template-columns:1fr 1fr}
  .content{padding:14px}
}
</style>
</head>
<body>
<div id="overlay"></div>
<div class="app">
  <div class="sb" id="sidebar">
    <div class="sb-logo"><div class="sb-icon">🎯</div>Quiz Coach</div>
    <nav class="sb-nav" id="nav"></nav>
    <div class="sb-foot">Training Quiz Coach · Coach</div>
  </div>
  <div class="main">
    <div class="topbar">
      <button class="mb-btn" id="menu-btn" onclick="toggleSidebar()">☰</button>
      <div class="tb-title" id="page-title">Overview</div>
      <button class="btn btn-g btn-sm" onclick="toggleTheme()" id="theme-btn">☀</button>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>
<script>
// ── CONFIG ────────────────────────────────────────────────────────────────────
var SCRIPT_URL = '';

// ── STATE ─────────────────────────────────────────────────────────────────────
var state = {
  page: 'overview',
  theme: 'dark',
  modules: [],
  passMark: 75,
  activeModuleIdx: null,
};

var insightsState = { results: [], loading: false, loaded: false, err: '' };

// ── PERSISTENCE ───────────────────────────────────────────────────────────────
function saveState(){
  try{
    localStorage.setItem('qc_creator_v2', JSON.stringify({
      modules: state.modules,
      passMark: state.passMark,
      theme: state.theme,
    }));
  }catch(e){}
}

function loadState(){
  try{
    var su = localStorage.getItem('qc_script_url');
    if(su) SCRIPT_URL = su;
    var d = localStorage.getItem('qc_creator_v2');
    if(d){
      var p = JSON.parse(d);
      state.modules = p.modules || [];
      state.passMark = p.passMark || 75;
      state.theme = p.theme || 'dark';
    }
  }catch(e){}
}

// ── HELPERS ───────────────────────────────────────────────────────────────────
function uid(){ return Math.random().toString(36).slice(2,9); }
function nowISO(){ return new Date().toISOString(); }
function fmtDate(iso){ return new Date(iso).toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function pct(n,d){ return d===0?0:Math.round(n/d*100); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function uniqueArr(arr){ var seen={},out=[]; arr.forEach(function(v){if(!seen[v]){seen[v]=1;out.push(v);}}); return out; }

// ── CSV PARSER ────────────────────────────────────────────────────────────────
function parseCSVLine(line){
  var cols=[],cur='',inQ=false;
  for(var i=0;i<line.length;i++){
    var c=line[i];
    if(c==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else{inQ=!inQ;}}
    else if(c===','&&!inQ){cols.push(cur);cur='';}
    else{cur+=c;}
  }
  cols.push(cur);
  return cols.map(function(c){return c.trim().replace(/^"|"$/g,'');});
}

function parseCSVFile(text){
  var lines=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
  var header=parseCSVLine(lines[0]);
  var hi=header.map(function(h){return h.toLowerCase().trim();});
  var qIdx=hi.findIndex(function(h){return h.includes('question');});
  var aIdx=hi.findIndex(function(h){return h==='option a'||h==='a';});
  var bIdx=hi.findIndex(function(h){return h==='option b'||h==='b';});
  var cIdx=hi.findIndex(function(h){return h==='option c'||h==='c';});
  var dIdx=hi.findIndex(function(h){return h==='option d'||h==='d';});
  var corrIdx=hi.findIndex(function(h){return h.includes('correct answer letter')||h==='correct answer'||h==='answer';});
  var chapIdx=hi.findIndex(function(h){return h.includes('chapter')||h.includes('topic')||h.includes('category');});
  if(qIdx===-1||aIdx===-1||corrIdx===-1) return {error:'Could not find columns. Found: '+header.join(', ')};
  var results=[];
  var optMap={A:0,B:1,C:2,D:3};
  for(var li=1;li<lines.length;li++){
    if(!lines[li].trim())continue;
    var cols=parseCSVLine(lines[li]);
    var q=cols[qIdx]||'';
    if(!q.trim())continue;
    var corrLetter=(cols[corrIdx]||'').trim().toUpperCase();
    var ci=optMap[corrLetter];
    if(ci===undefined)continue;
    results.push({
      id:uid(),text:q.trim(),
      options:[(cols[aIdx]||'').trim(),(cols[bIdx]||'').trim(),(cols[cIdx]||'').trim(),(cols[dIdx]||'').trim()],
      correctIndex:ci,
      explanation:'Correct answer: '+corrLetter,
      topic:chapIdx>=0?(cols[chapIdx]||'General').trim():'General',
      difficulty:'medium'
    });
  }
  return {questions:results};
}

// ── ROUTING ───────────────────────────────────────────────────────────────────
var NAV=[
  {id:'overview', icon:'⬡', label:'Overview'},
  {id:'modules',  icon:'📁', label:'Modules'},
  {id:'insights', icon:'👥', label:'Student Insights'},
  {id:'settings', icon:'⚙', label:'Settings'},
];

function navigate(page){
  state.page=page;
  state.activeModuleIdx=null;
  renderNav();
  renderPage();
  closeSidebar();
}

function renderNav(){
  var html='<div class="nav-lbl">Navigation</div>';
  NAV.forEach(function(item){
    var active=(state.page===item.id&&state.activeModuleIdx===null)?'active':'';
    html+='<div class="ni '+active+'" onclick="navigate(\''+item.id+'\')"><span>'+item.icon+'</span>'+item.label+'</div>';
  });
  document.getElementById('nav').innerHTML=html;
  var label=state.activeModuleIdx!==null
    ?((state.modules[state.activeModuleIdx]||{}).name||'Module')
    :(NAV.find(function(n){return n.id===state.page;})||{}).label||'';
  document.getElementById('page-title').textContent=label;
}

function renderPage(){
  var el=document.getElementById('content');
  if(state.activeModuleIdx!==null){el.innerHTML=renderModuleDetail();bindModuleDetail();return;}
  switch(state.page){
    case 'overview': el.innerHTML=renderOverview(); break;
    case 'modules':  el.innerHTML=renderModules(); bindModules(); break;
    case 'insights': el.innerHTML=renderInsights(); break;
    case 'settings': el.innerHTML=renderSettings(); break;
  }
}

// ── OVERVIEW ──────────────────────────────────────────────────────────────────
function renderOverview(){
  var m=state.modules;
  var sr=insightsState.results;
  var pm=state.passMark;
  var students=uniqueArr(sr.map(function(r){return r.studentName;}));
  var passRate=sr.length?pct(sr.filter(function(r){return r.passed==='true'||r.passed===true;}).length,sr.length):0;
  var totalQs=sr.reduce(function(a,r){return a+Number(r.totalQuestions||0);},0);

  var html='<div class="sh"><div><div class="st">Overview</div><div class="ss">Your coaching dashboard</div></div></div>';
  html+='<div class="g4" style="margin-bottom:16px">';
  [{l:'Modules',v:m.length,i:'📚'},{l:'Students',v:students.length,i:'👥'},{l:'Questions Answered',v:totalQs,i:'📝'},{l:'Pass Rate',v:passRate+'%',i:'✅'}].forEach(function(k){
    html+='<div class="card" style="margin-bottom:0"><div style="font-size:22px;margin-bottom:8px">'+k.i+'</div><div class="kv">'+k.v+'</div><div class="kl">'+k.l+'</div></div>';
  });
  html+='</div>';
  if(!m.length){
    html+='<div class="card"><div style="text-align:center;padding:32px 20px"><div style="font-size:44px;margin-bottom:12px">📚</div><div style="font-size:16px;font-weight:600;margin-bottom:7px">No modules yet</div><div style="font-size:13px;color:var(--tx2);margin-bottom:16px">Go to Modules to add your question bank.</div><button class="btn btn-p" onclick="navigate(\'modules\')">Add First Module</button></div></div>';
  } else {
    html+='<div class="g2" style="margin-bottom:0">';
    html+='<div class="card" style="margin-bottom:0"><div class="ct">Modules</div>';
    m.forEach(function(mod){
      html+='<div style="display:flex;align-items:center;gap:9px;margin-bottom:9px;padding:9px 11px;background:var(--bg3);border-radius:8px">';
      html+='<span style="font-size:18px">📗</span>';
      html+='<div style="flex:1"><div style="font-size:12px;font-weight:600">'+esc(mod.name)+'</div>';
      html+='<div style="font-size:10px;color:var(--tx3)">'+mod.questions.length+' questions · '+(mod.category||'Uncategorised')+'</div></div>';
      html+='</div>';
    });
    html+='</div>';
    html+='<div class="card" style="margin-bottom:0"><div class="ct">Recent Results</div>';
    if(!sr.length){
      html+='<div style="color:var(--tx3);font-size:13px;text-align:center;padding:20px 0">No student results yet.<br><span style="font-size:11px">Results appear once students complete quizzes.</span></div>';
    } else {
      sr.slice(-5).reverse().forEach(function(r){
        var passed=r.passed==='true'||r.passed===true;
        html+='<div style="display:flex;align-items:center;gap:9px;margin-bottom:9px">';
        html+='<span class="badge '+(passed?'b-pass':'b-fail')+'">'+r.score+'%</span>';
        html+='<div style="flex:1"><div style="font-size:12px;font-weight:500">'+esc(r.studentName)+'</div>';
        html+='<div style="font-size:10px;color:var(--tx3)">'+esc(r.moduleName)+' · '+fmtDate(r.date)+'</div></div>';
        html+='<span class="badge '+(passed?'b-pass':'b-fail')+'" style="font-size:10px">'+(passed?'PASS':'FAIL')+'</span>';
        html+='</div>';
      });
    }
    html+='<button class="btn btn-s btn-sm" style="margin-top:8px;width:100%;justify-content:center" onclick="navigate(\'insights\')">View All Insights →</button>';
    html+='</div></div>';
  }
  return html;
}

// ── MODULES ───────────────────────────────────────────────────────────────────
var modState={tab:'csv',name:'',category:'',questions:[],err:'',qText:'',opts:['','','',''],correct:0,explain:'',topic:'',diff:'medium',editIdx:null};

function renderModules(){
  var ms=state.modules;
  var html='<div class="sh"><div><div class="st">Training Modules</div><div class="ss">Manage your question banks</div></div></div>';

  // Publish bar
  html+='<div style="background:linear-gradient(135deg,rgba(79,142,247,.1),rgba(167,139,250,.1));border:1px solid rgba(79,142,247,.25);border-radius:12px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">';
  html+='<div><div style="font-size:13px;font-weight:600;margin-bottom:2px">📡 Publish to Students</div>';
  html+='<div style="font-size:11px;color:var(--tx2)">'+ms.length+' module(s) · Download modules.json then upload to GitHub</div></div>';
  html+='<button id="publish-btn" class="btn btn-p btn-sm" onclick="publishModules()"'+(ms.length?'':' disabled')+'>⬆ Publish All Modules</button>';
  html+='</div>';

  // Saved modules grouped by category
  if(ms.length){
    var cats={};
    ms.forEach(function(m,i){
      var c=m.category||'Uncategorised';
      if(!cats[c])cats[c]=[];
      cats[c].push({m:m,i:i});
    });
    var catKeys=Object.keys(cats).sort();
    catKeys.forEach(function(cat){
      html+='<div style="margin-bottom:18px">';
      html+='<div style="font-size:11px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px">📂 '+esc(cat)+' · '+cats[cat].length+' module(s)</div>';
      html+='<div class="g3">';
      cats[cat].forEach(function(x){
        var m=x.m,i=x.i;
        html+='<div class="mc" style="margin-bottom:0">';
        html+='<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px">';
        html+='<span style="font-size:15px">📗</span>';
        html+='<div style="display:flex;gap:4px">';
        html+='<button class="btn btn-sm" style="background:rgba(79,142,247,.1);color:var(--ac2);border:1px solid rgba(79,142,247,.2);padding:3px 8px;font-size:11px" onclick="renameModule('+i+')">✏️</button>';
        html+='<button class="btn btn-sm" style="background:rgba(247,88,88,.08);color:var(--rd);border:1px solid rgba(247,88,88,.2);padding:3px 8px;font-size:11px" onclick="deleteModule('+i+')">🗑</button>';
        html+='</div></div>';
        html+='<div style="font-size:13px;font-weight:700;margin-bottom:3px">'+esc(m.name)+'</div>';
        html+='<div style="font-size:11px;color:var(--tx2);margin-bottom:9px">'+m.questions.length+' questions</div>';
        var topicBadges=m.topics.slice(0,3);
        html+='<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px">';
        topicBadges.forEach(function(t){html+='<span class="badge b-topic">'+esc(t)+'</span>';});
        html+='</div>';
        html+='<div style="display:flex;gap:6px">';
        html+='<button class="btn btn-s btn-sm" onclick="openModuleDetail('+i+')">👁 View</button>';
        html+='</div>';
        html+='</div>';
      });
      html+='</div></div>';
    });
  }

  // New module form
  html+='<div class="card" style="margin-bottom:14px"><div class="ct">New Module</div>';
  html+='<div class="g2" style="margin-bottom:10px">';
  html+='<div><label style="font-size:11px;color:var(--tx2);font-weight:600;display:block;margin-bottom:5px">Module Name</label>';
  html+='<input class="inp" id="mod-name" placeholder="e.g. Legacy 500..." value="'+esc(modState.name)+'"></div>';
  html+='<div><label style="font-size:11px;color:var(--tx2);font-weight:600;display:block;margin-bottom:5px">Category (optional)</label>';
  html+='<input class="inp" id="mod-category" placeholder="e.g. Systems, Procedures..." value="'+esc(modState.category)+'"></div>';
  html+='</div>';
  if(modState.err) html+='<div class="err-box">'+esc(modState.err)+'</div>';
  html+='</div>';

  // Import tabs
  html+='<div class="card"><div class="tabs">';

function bindModules(){
  var f=document.getElementById('csv-file');
  if(f) f.onchange=function(e){loadCSV(e.target.files[0]);};
  var dz=document.getElementById('dropzone');
  if(dz){
    dz.ondragover=function(e){e.preventDefault();dz.classList.add('over');};
    dz.ondragleave=function(){dz.classList.remove('over');};
    dz.ondrop=function(e){e.preventDefault();dz.classList.remove('over');loadCSV(e.dataTransfer.files[0]);};
  }
}

function switchModTab(tab){
  saveModFormState();
  modState.tab=tab;
  renderPage();
}

function saveModFormState(){
  var n=document.getElementById('mod-name'); if(n) modState.name=n.value;
  var nc=document.getElementById('mod-category'); if(nc) modState.category=nc.value;
  if(modState.tab==='manual'){
    var qt=document.getElementById('q-text'); if(qt) modState.qText=qt.value;
    for(var i=0;i<4;i++){var o=document.getElementById('opt-'+i);if(o)modState.opts[i]=o.value;}
    var tp=document.getElementById('q-topic'); if(tp) modState.topic=tp.value;
    var df=document.getElementById('q-diff'); if(df) modState.diff=df.value;
    var ex=document.getElementById('q-explain'); if(ex) modState.explain=ex.value;
  }
}

function loadCSV(file){
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var result=parseCSVFile(e.target.result);
    if(result.error){modState.err=result.error;renderPage();return;}
    if(!result.questions.length){modState.err='No valid questions found.';renderPage();return;}
    modState.questions=result.questions;
    modState.err='';
    var nameEl=document.getElementById('mod-name');
    if(nameEl&&!nameEl.value.trim()) modState.name=file.name.replace(/\.csv$/i,'').replace(/[-_]/g,' ');
    renderPage();
  };
  reader.readAsText(file);
}

function setCorrect(i){saveModFormState();modState.correct=i;renderPage();}

function addQuestion(){
  saveModFormState();
  if(!modState.qText.trim()){modState.err='Question text required.';renderPage();return;}
  if(modState.opts.some(function(o){return !o.trim();})){modState.err='All 4 options required.';renderPage();return;}
  if(!modState.topic.trim()){modState.err='Topic required.';renderPage();return;}
  modState.err='';
  var q={id:uid(),text:modState.qText.trim(),options:modState.opts.map(function(o){return o.trim();}),correctIndex:modState.correct,explanation:modState.explain.trim(),topic:modState.topic.trim(),difficulty:modState.diff};
  if(modState.editIdx!==null){modState.questions[modState.editIdx]=q;modState.editIdx=null;}
  else{modState.questions.push(q);}
  modState.qText='';modState.opts=['','','',''];modState.correct=0;modState.explain='';modState.topic='';modState.diff='medium';
  renderPage();
}

function cancelEdit(){modState.editIdx=null;modState.qText='';modState.opts=['','','',''];modState.correct=0;modState.explain='';modState.topic='';renderPage();}

function editQuestion(i){
  saveModFormState();
  var q=modState.questions[i];
  modState.tab='manual';modState.editIdx=i;modState.qText=q.text;
  modState.opts=q.options.slice();modState.correct=q.correctIndex;
  modState.explain=q.explanation;modState.topic=q.topic;modState.diff=q.difficulty;
  renderPage();
}

function deleteQuestion(i){modState.questions.splice(i,1);renderPage();}

function saveModule(){
  saveModFormState();
  if(!modState.name.trim()){modState.err='Module name required.';renderPage();return;}
  if(!modState.questions.length){modState.err='Add at least 1 question.';renderPage();return;}
  var topics=uniqueArr(modState.questions.map(function(q){return q.topic;}));
  state.modules.push({id:uid(),name:modState.name.trim(),category:modState.category.trim(),topics:topics,questions:modState.questions.slice(),createdAt:nowISO()});
  modState.name='';modState.category='';modState.questions=[];modState.err='';modState.qText='';modState.opts=['','','',''];modState.topic='';
  saveState();
  renderPage();
}

function deleteModule(i){
  if(!confirm('Delete "'+state.modules[i].name+'"? This cannot be undone.'))return;
  state.modules.splice(i,1);
  saveState();
  renderPage();
}

function renameModule(i){
  var m=state.modules[i];
  var newName=prompt('Rename module:',m.name);
  if(newName&&newName.trim()){
    m.name=newName.trim();
    var newCat=prompt('Category (current: "'+(m.category||'Uncategorised')+'"):',m.category||'');
    if(newCat!==null) m.category=newCat.trim();
    saveState();
    renderPage();
  }
}

function publishModules(){
  if(!state.modules.length){alert('No modules to publish.');return;}
  if(!SCRIPT_URL){alert('No Apps Script URL configured.\nGo to Settings to add it first.');return;}
  var btn=document.getElementById('publish-btn');
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spinner"></span>Publishing...';}
  var payload=JSON.stringify({type:'publish_modules',version:nowISO(),modules:state.modules});
  fetch(SCRIPT_URL,{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:payload,
  })
  .then(function(r){return r.json();})
  .then(function(data){
    if(data.status==='ok'){
      showToast('✅ Published! Students can now update their app.');
    } else {
      showToast('❌ Publish failed: '+(data.message||'Unknown error'),true);
    }
    if(btn){btn.disabled=false;btn.innerHTML='⬆ Publish All Modules';}
  })
  .catch(function(e){
    showToast('❌ Publish failed: '+e.message,true);
    if(btn){btn.disabled=false;btn.innerHTML='⬆ Publish All Modules';}
  });
}

function showToast(msg,isErr){
  var t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:'+(isErr?'var(--rd)':'var(--gr)')+';color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.3);white-space:nowrap';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(function(){t.remove();},3500);
}

function loadInsights(){
  if(!SCRIPT_URL){
    insightsState.err='No Apps Script URL configured. Go to Settings to add it.';
    insightsState.loading=false;
    renderPage();
    return;
  }
  insightsState.loading=true;
  insightsState.err='';
  renderPage();
  fetch(SCRIPT_URL+'?t='+Date.now())
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(function(data){
      insightsState.results=data.results||[];
      insightsState.loading=false;
      insightsState.loaded=true;
      renderPage();
    })
    .catch(function(e){
      insightsState.loading=false;
      insightsState.err=e.message;
      renderPage();
    });
}

    html+='<div style="font-size:44px;margin-bottom:12px">👥</div>';
    html+='<div style="font-size:16px;font-weight:600;margin-bottom:7px">Load Student Results</div>';
    html+='<div style="font-size:13px;color:var(--tx2);margin-bottom:16px">Fetch the latest quiz results from all students.</div>';
    html+='<button class="btn btn-p" onclick="loadInsights()">Load Results</button>';
    html+='</div>';
    return html;
  }

  if(insightsState.err){
    html+='<div class="card" style="border:1px solid rgba(247,88,88,.3)">';
    html+='<div style="color:var(--rd);font-size:13px;margin-bottom:8px;font-weight:600">⚠ Could not load results</div>';
    html+='<div style="font-size:12px;color:var(--tx2);margin-bottom:12px">'+esc(insightsState.err)+'</div>';
    html+='<button class="btn btn-p btn-sm" onclick="loadInsights()">Try Again</button></div>';
    return html;
  }

  if(!sr.length){
    html+='<div class="card"><div style="text-align:center;padding:32px 20px">';
    html+='<div style="font-size:44px;margin-bottom:12px">📭</div>';
    html+='<div style="font-size:16px;font-weight:600;margin-bottom:7px">No results yet</div>';
    html+='<div style="font-size:13px;color:var(--tx2)">Results appear once students complete quizzes.</div>';
    html+='</div></div>';
    return html;
  }

  var students=uniqueArr(sr.map(function(r){return r.studentName;}));
  var avgScore=Math.round(sr.reduce(function(a,r){return a+Number(r.score);},0)/sr.length);
  var passRate=pct(sr.filter(function(r){return r.passed==='true'||r.passed===true;}).length,sr.length);

  html+='<div class="g4" style="margin-bottom:16px">';
  [{l:'Students',v:students.length},{l:'Total Quizzes',v:sr.length},{l:'Avg Score',v:avgScore+'%'},{l:'Pass Rate',v:passRate+'%'}].forEach(function(k){
    html+='<div class="card" style="margin-bottom:0"><div class="kv">'+k.v+'</div><div class="kl">'+k.l+'</div></div>';
  });
  html+='</div>';

  // Topic struggles
  var topicMap={};
  sr.forEach(function(r){
    var tb={};
    try{tb=typeof r.topicBreakdown==='string'?JSON.parse(r.topicBreakdown):r.topicBreakdown;}catch(e){}
    Object.keys(tb||{}).forEach(function(t){
      var d=tb[t];
      if(!topicMap[t])topicMap[t]={correct:0,total:0};
      topicMap[t].correct+=Number(d.correct||0);
      topicMap[t].total+=Number(d.total||0);
    });
  });
  var topicArr=[];
  Object.keys(topicMap).forEach(function(t){
    topicArr.push({topic:t,avg:pct(topicMap[t].correct,topicMap[t].total),correct:topicMap[t].correct,total:topicMap[t].total});
  });
  topicArr.sort(function(a,b){return a.avg-b.avg;});

  html+='<div class="g2" style="margin-bottom:14px">';

  html+='<div class="card" style="margin-bottom:0"><div class="ct">⚠ Weakest Topics</div>';
  topicArr.slice(0,8).forEach(function(t){
    var col=t.avg<60?'var(--rd)':t.avg<75?'var(--am)':'var(--gr)';
    html+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">';
    html+='<div style="font-size:11px;color:var(--tx2);width:100px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(t.topic)+'</div>';
    html+='<div style="flex:1;background:var(--bg3);border-radius:99px;height:14px;overflow:hidden">';
    html+='<div style="width:'+t.avg+'%;background:'+col+';height:100%;border-radius:99px;display:flex;align-items:center;padding-left:5px">';
    html+='<span style="font-size:9px;color:#fff;font-weight:700">'+t.avg+'%</span></div></div>';
    html+='<div style="font-size:10px;color:var(--tx3);white-space:nowrap">'+t.correct+'/'+t.total+'</div>';
    html+='</div>';
  });
  html+='</div>';

  // Student leaderboard
  var studentStats=[];
  students.forEach(function(name){
    var rows=sr.filter(function(r){return r.studentName===name;});
    var avg=Math.round(rows.reduce(function(a,r){return a+Number(r.score);},0)/rows.length);
    var passes=rows.filter(function(r){return r.passed==='true'||r.passed===true;}).length;
    var last=rows[rows.length-1];
    studentStats.push({name:name,avg:avg,quizzes:rows.length,passes:passes,lastDate:last?last.date:''});
  });
  studentStats.sort(function(a,b){return b.avg-a.avg;});

  html+='<div class="card" style="margin-bottom:0"><div class="ct">👤 Students</div>';
  studentStats.forEach(function(s,i){
    var col=s.avg>=pm?'var(--gr)':s.avg>=pm*0.8?'var(--am)':'var(--rd)';
    html+='<div style="display:flex;align-items:center;gap:9px;margin-bottom:9px;padding:9px 11px;background:var(--bg3);border-radius:8px">';
    html+='<div style="width:22px;height:22px;border-radius:50%;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--tx3)">'+(i+1)+'</div>';
    html+='<div style="flex:1"><div style="font-size:12px;font-weight:600">'+esc(s.name)+'</div>';
    html+='<div style="font-size:10px;color:var(--tx3)">'+s.quizzes+' quizzes · '+s.passes+' passed'+(s.lastDate?' · '+fmtDate(s.lastDate):'')+'</div></div>';
    html+='<div style="font-size:14px;font-weight:700;color:'+col+'">'+s.avg+'%</div>';
    html+='</div>';
  });
  html+='</div></div>';

  // Per module
  html+='<div class="card"><div class="ct">📋 By Module</div>';
  var moduleNames=uniqueArr(sr.map(function(r){return r.moduleName;}));
  moduleNames.forEach(function(mn){
    var rows=sr.filter(function(r){return r.moduleName===mn;});
    var avg=Math.round(rows.reduce(function(a,r){return a+Number(r.score);},0)/rows.length);
    var passes=rows.filter(function(r){return r.passed==='true'||r.passed===true;}).length;
    var col=avg>=pm?'var(--gr)':avg>=pm*0.8?'var(--am)':'var(--rd)';
    html+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:11px 13px;background:var(--bg3);border-radius:8px">';
    html+='<div style="flex:1"><div style="font-size:13px;font-weight:600;margin-bottom:2px">'+esc(mn)+'</div>';
    html+='<div style="font-size:11px;color:var(--tx2)">'+rows.length+' attempts · '+passes+' passed · '+pct(passes,rows.length)+'% pass rate</div></div>';
    html+='<div style="font-size:16px;font-weight:700;color:'+col+'">'+avg+'%</div>';
    html+='</div>';
  });
  html+='</div>';
  return html;
}

// ── SETTINGS ──────────────────────────────────────────────────────────────────
function renderSettings(){
  var html='<div style="max-width:500px">';
  html+='<div class="sh"><div><div class="st">Settings</div></div></div>';

  html+='<div class="card"><div class="ct">Appearance</div>';
  html+='<div style="display:flex;align-items:center;justify-content:space-between"><div style="font-size:13px;font-weight:600">Theme</div>';
  html+='<div class="tog"><button class="tog-b'+(state.theme==='dark'?' active':'')+'" onclick="setTheme(\'dark\')">🌙 Dark</button><button class="tog-b'+(state.theme==='light'?' active':'')+'" onclick="setTheme(\'light\')">☀ Light</button></div></div></div>';

  html+='<div class="card"><div class="ct">Apps Script URL</div>';
  html+='<div style="font-size:13px;color:var(--tx2);margin-bottom:10px;line-height:1.6">Paste your Google Apps Script URL to enable Student Insights.</div>';
  html+='<div style="display:flex;gap:8px;margin-bottom:8px"><input class="inp" id="script-url" placeholder="https://script.google.com/macros/s/..." value="'+esc(SCRIPT_URL)+'"><button class="btn btn-p btn-sm" onclick="saveScriptURL()">Save</button></div>';
  html+='<div style="font-size:11px;color:var(--tx3)">Get this from Apps Script → Deploy → Manage Deployments</div></div>';

  html+='<div class="card"><div class="ct">Pass Threshold</div>';
  html+='<div style="font-size:13px;font-weight:600;margin-bottom:3px">Minimum score to pass (%)</div>';
  html+='<div style="font-size:11px;color:var(--tx2);margin-bottom:11px">Default: 75%</div>';
  html+='<div style="display:flex;gap:9px;align-items:center;margin-bottom:9px"><input class="inp" id="pass-mark" style="width:80px" type="number" value="'+state.passMark+'" min="1" max="100"><button class="btn btn-p btn-sm" onclick="savePassMark()">Save</button></div>';
  html+='<div style="padding:9px 11px;background:var(--bg3);border-radius:8px;font-size:12px;color:var(--tx2)">Current: <strong style="color:var(--tx)">'+state.passMark+'%</strong></div></div>';

  html+='</div>';
  return html;
}

function saveScriptURL(){
  var el=document.getElementById('script-url');
  if(el&&el.value.trim()){
    SCRIPT_URL=el.value.trim();
    try{localStorage.setItem('qc_script_url',SCRIPT_URL);}catch(e){}
    alert('URL saved!');
  }
}

function savePassMark(){
  var el=document.getElementById('pass-mark');
  if(el) state.passMark=+el.value;
  saveState();
  renderPage();
}

// ── THEME & SIDEBAR ───────────────────────────────────────────────────────────
function setTheme(t){
  state.theme=t;
  document.documentElement.setAttribute('data-theme',t);
  document.getElementById('theme-btn').textContent=t==='dark'?'☀':'🌙';
  saveState();
  renderPage();
}

function toggleTheme(){
  setTheme(state.theme==='dark'?'light':'dark');
}

function toggleSidebar(){
  var sb=document.getElementById('sidebar');
  var ov=document.getElementById('overlay');
  sb.classList.toggle('open');
  ov.style.display=sb.classList.contains('open')?'block':'none';
}

function closeSidebar(){
  var sb=document.getElementById('sidebar');
  var ov=document.getElementById('overlay');
  sb.classList.remove('open');
  ov.style.display='none';
}

document.getElementById('overlay').onclick=closeSidebar;

// ── INIT ──────────────────────────────────────────────────────────────────────
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('service-worker.js');
  });
}
loadState();
if(state.theme==='light') document.documentElement.setAttribute('data-theme','light');
document.getElementById('theme-btn').textContent=state.theme==='dark'?'☀':'🌙';
renderNav();
renderPage();
</script>
</body>
</html>
